  var fav = document.getElementById('fav');
  fav.href = ICO;
  var timer = null, n = 0, fase = false, ultimaNotif = null;

  function parar(){ if (timer) clearInterval(timer); timer = null; document.title = TITULO; fav.href = ICO; }
  function piscar(){
    if (timer) return;
    timer = setInterval(function(){
      fase = !fase;
      document.title = fase ? '(' + n + ') LEMBRETE' : TITULO;
      fav.href = fase ? ICO_A : ICO;
    }, 1000);
  }
  function notificar(texto){
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    try {
      if (ultimaNotif) ultimaNotif.close();
      ultimaNotif = new Notification('Lembrete · CRM Dellamed', { body: String(texto || 'Você tem um lembrete.').slice(0, 180), tag: 'crm-dellamed', requireInteraction: true });
      ultimaNotif.onclick = function(){ window.focus(); this.close(); };
    } catch (_) {}
  }

  var frame = document.querySelector('iframe');
  // Só aceita mensagens vindas do CRM que está DENTRO desta página
  // (endereço do Apps Script + a janela precisa ser a do iframe acima)
  function doCrm(e){
    try {
      if (!/\.googleusercontent\.com$/.test(new URL(e.origin).hostname)) return false;
      var w = frame && frame.contentWindow;
      return !!w && (e.source === w || e.source.parent === w);
    } catch (_) { return false; }
  }

  window.addEventListener('message', function(e){
    if (!doCrm(e)) return;
    var d = e.data || {};
    if (typeof d !== 'object') return;
    if (d.type !== 'crm-dellamed') return;
    if (d.acao === 'permissao') { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); return; }
    if (d.acao === 'lembrete') {
      n = +d.n || 0;
      if (n > 0) { piscar(); if (d.novo) notificar(d.texto); }
      else { parar(); if (ultimaNotif) { ultimaNotif.close(); ultimaNotif = null; } }
    }
  });
})();
</script>
